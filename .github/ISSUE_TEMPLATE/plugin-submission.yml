# GitHubログイン済みユーザーからプラグイン登録情報を受け付けるフォーム（scripts/issue-templates.mjs で生成）。
name: "プラグイン登録"
description: "プラグインのメタデータと配布リンクの掲載を申請"
title: "[プラグイン登録]"
body:
  - type: markdown
    attributes:
      value: |
        GitHub アカウントで投稿者を確認します。必須なのは配布リンクだけです。種別、ID、名前、作者などは、空のままにすると、配布元の情報（WAM は同じフォルダーの descriptor.json、マニフェストはその JSON）から自動で入ります。入力した項目は、そちらより優先されます。
  - type: dropdown
    id: type
    attributes:
      label: "種別"
      options:
        - wam
        - manifest
        - vst
    validations:
      required: false
  - type: input
    id: id
    attributes:
      label: "ID"
      description: "任意。空なら配布元の情報から決まります。小文字の英数字、ピリオド、ハイフン、アンダースコアを使用してください（2〜96文字）。"
      placeholder: com.example.plugin
    validations:
      required: false
      max-length: 96
  - type: input
    id: name
    attributes:
      label: "プラグイン名"
      description: "任意。空なら配布元の情報から決まります。"
      placeholder: Example Reverb
    validations:
      required: false
      max-length: 120
  - type: input
    id: author
    attributes:
      label: "作者"
      description: "任意。空なら配布元の情報から決まります。"
    validations:
      required: false
      max-length: 120
  - type: input
    id: url
    attributes:
      label: "配布リンク"
      description: "種別に応じた WAM JavaScript、JSON マニフェスト、または VST DLL の HTTPS URL。"
      placeholder: https://example.com/plugin.js
    validations:
      required: true
      max-length: 2048
  - type: input
    id: description
    attributes:
      label: "説明（任意）"
    validations:
      required: false
      max-length: 500
  - type: input
    id: website
    attributes:
      label: "作者サイト（任意）"
      description: "HTTPS URL を入力してください。"
    validations:
      required: false
      max-length: 2048
  - type: input
    id: categories
    attributes:
      label: "カテゴリ（カンマ区切り、任意）"
      placeholder: Effect, Reverb
    validations:
      required: false
      max-length: 400
