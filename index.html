<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse community plugins for WeVocal Studio.">
    <title>WeVocal Plugin Packages</title>
    <link rel="stylesheet" href="./site.css">
    <script type="module" src="./site.js"></script>
  </head>
  <body>
    <header>
      <p class="eyebrow">COMMUNITY CATALOG</p>
      <h1>WeVocal plugins</h1>
      <p>Browse plugins hosted by their original authors. Install them from WeVocal Studio.</p>
      <label class="search">
        <span class="visually-hidden">Search plugins</span>
        <input id="search" type="search" placeholder="Search by name, author, or category">
      </label>
      <p id="status" role="status">Loading catalog…</p>
    </header>
    <main>
      <section id="plugins" class="plugins" aria-label="Plugins"></section>
    </main>
    <footer>
      <a href="https://github.com/PTOM76/wevocal-plugin-pkgs">Catalog source</a>
      <span>Plugin files remain hosted by their authors.</span>
    </footer>
  </body>
</html>
