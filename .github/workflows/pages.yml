name: デプロイ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: GitHub Pages にデプロイ
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 依存パッケージをインストール
        run: npm ci
      - name: サイトをビルド
        run: npm run build
      - name: JSON カタログを配置
        run: |
          cp -R data dist/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: GitHub Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
