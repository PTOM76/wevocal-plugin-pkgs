# GitHub Issue Form の投稿を検証し、レビュー用のプルリクエストを作る。
name: プラグイン投稿を審査

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: plugin-submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      startsWith(github.event.issue.title, '[プラグイン登録]') ||
      startsWith(github.event.issue.title, '[Plugin submission]') ||
      startsWith(github.event.issue.title, '[플러그인 등록]') ||
      startsWith(github.event.issue.title, '[插件登记]') ||
      startsWith(github.event.issue.title, '[外掛登錄]')
    name: 投稿を検証してプルリクエストを作成
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 投稿後の手順をIssueへ案内
        uses: actions/github-script@v7
        with:
          script: |
            const { langOfTitle, replyText } = await import(`file://${process.env.GITHUB_WORKSPACE}/scripts/submission-i18n.mjs`)
            const lang = langOfTitle(context.payload.issue.title)
            const marker = '<!-- plugin-submission-help:v1 -->'
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            })
            if (comments.some((comment) => comment.body.includes(marker))) return
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: replyText(lang, 'received', marker),
            })
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 投稿内容を解析
        run: node scripts/issue-submission.mjs "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/plugin-submission.json"
      - name: メタデータを検証してカタログへ追加または更新
        id: catalog
        env:
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: node scripts/catalog.mjs submit-json "$RUNNER_TEMP/plugin-submission.json" "$ISSUE_USER"
      - name: レビュー用プルリクエストを作成
        id: pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: plugin-submission-${{ github.event.issue.number }}
          delete-branch: true
          commit-message: "catalog: プラグイン登録情報を${{ steps.catalog.outputs.action == 'updated' && '更新' || '追加' }}"
          title: "プラグインカタログ: ${{ steps.catalog.outputs.action == 'updated' && '更新提案' || '登録提案' }} #${{ github.event.issue.number }}"
          body: |
            **GitHub Issue Form** から送信された登録提案です。

            - 投稿者: @${{ github.event.issue.user.login }}
            - 投稿: ${{ github.event.issue.html_url }}

            マージ前に、メタデータと配布元リンクを確認してください。
      - name: Issue に結果を通知
        if: steps.pull-request.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        env:
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        with:
          script: |
            const { langOfTitle, replyText } = await import(`file://${process.env.GITHUB_WORKSPACE}/scripts/submission-i18n.mjs`)
            const lang = langOfTitle(context.payload.issue.title)
            const number = Number(process.env.PULL_REQUEST_NUMBER)
            if (!Number.isSafeInteger(number) || number < 1) {
              throw new Error('作成されたプルリクエスト番号が不正です')
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: replyText(lang, 'pullRequest', number),
            })
      - name: 失敗を Issue に通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { langOfTitle, replyText } = await import(`file://${process.env.GITHUB_WORKSPACE}/scripts/submission-i18n.mjs`)
            const lang = langOfTitle(context.payload.issue.title)
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: replyText(lang, 'failed'),
            })
