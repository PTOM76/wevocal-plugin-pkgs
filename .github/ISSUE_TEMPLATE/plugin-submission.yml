# GitHubログイン済みユーザーからプラグイン登録情報を受け付けるフォーム。
name: プラグイン登録
description: プラグインのメタデータと配布リンクの掲載を申請
title: "[プラグイン登録]"
body:
  - type: markdown
    attributes:
      value: |
        <!-- plugin-submission-v1 -->
        GitHub アカウントで投稿者を確認します。配布元が公開しているURLを入力してください。
  - type: dropdown
    id: type
    attributes:
      label: 種別
      options:
        - wam
        - manifest
        - vst
    validations:
      required: true
  - type: input
    id: id
    attributes:
      label: ID
      description: 小文字の英数字、ピリオド、ハイフン、アンダースコアを使用してください（2〜96文字）。
      placeholder: com.example.plugin
    validations:
      required: true
      min-length: 2
      max-length: 96
  - type: input
    id: name
    attributes:
      label: プラグイン名
      placeholder: Example Reverb
    validations:
      required: true
      max-length: 120
  - type: input
    id: author
    attributes:
      label: 作者
    validations:
      required: true
      max-length: 120
  - type: input
    id: url
    attributes:
      label: 配布リンク
      description: 種別に応じた WAM JavaScript、JSON マニフェスト、または VST DLL の HTTPS URL。
      placeholder: https://example.com/plugin.js
    validations:
      required: true
      max-length: 2048
  - type: input
    id: description
    attributes:
      label: 説明（任意）
    validations:
      required: false
      max-length: 500
  - type: input
    id: website
    attributes:
      label: 作者サイト（任意）
      description: HTTPS URL を入力してください。
    validations:
      required: false
      max-length: 2048
  - type: input
    id: categories
    attributes:
      label: カテゴリ（カンマ区切り、任意）
      placeholder: Effect, Reverb
    validations:
      required: false
      max-length: 400
