name: カタログを公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: GitHub Pages に公開
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 公開ファイルを準備
        run: |
          mkdir -p _site
          cp index.html site.css site.js _site/
          cp -R data _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: GitHub Pages に公開
        id: deployment
        uses: actions/deploy-pages@v4
