name: プラグインを登録

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 公式 WAM カタログを取り込むか、URL を 1 件登録します
        type: choice
        options:
          - WAMカタログを同期
          - URL を登録
        default: WAMカタログを同期
        required: true
      type:
        description: 登録する URL の種類
        type: choice
        options:
          - wam
          - manifest
          - vst
        default: wam
        required: true
      id:
        description: カタログ内で使う固定 ID
        type: string
        required: false
      name:
        description: 表示名
        type: string
        required: false
      author:
        description: 作者名
        type: string
        required: false
      url:
        description: プラグインの配布元 URL
        type: string
        required: false
      description:
        description: 短い説明
        type: string
        required: false
      website:
        description: 作者またはプラグインのウェブサイト
        type: string
        required: false
      categories:
        description: カテゴリ（カンマ区切り）
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  register:
    name: プラグインを登録
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WAMカタログを取り込む
        if: inputs.operation == 'WAMカタログを同期'
        run: node scripts/catalog.mjs sync-wam
      - name: プラグインURLを登録
        if: inputs.operation == 'リンクを登録'
        env:
          PLUGIN_TYPE: ${{ inputs.type }}
          PLUGIN_ID: ${{ inputs.id }}
          PLUGIN_NAME: ${{ inputs.name }}
          PLUGIN_AUTHOR: ${{ inputs.author }}
          PLUGIN_URL: ${{ inputs.url }}
          PLUGIN_DESCRIPTION: ${{ inputs.description }}
          PLUGIN_WEBSITE: ${{ inputs.website }}
          PLUGIN_CATEGORIES: ${{ inputs.categories }}
        run: |
          node scripts/catalog.mjs add "$PLUGIN_TYPE" "$PLUGIN_ID" "$PLUGIN_NAME" "$PLUGIN_AUTHOR" "$PLUGIN_URL" "$PLUGIN_DESCRIPTION" "$PLUGIN_WEBSITE" "$PLUGIN_CATEGORIES"
      - name: 登録内容のプルリクエストを作成
        uses: peter-evans/create-pull-request@v7
        with:
          branch: plugin-registration-${{ github.run_id }}
          delete-branch: true
          commit-message: "catalog: プラグイン登録情報を更新"
          title: "プラグインカタログ: 登録情報を更新"
          body: |
            プラグイン登録のワークフローを作成しました。

            マージする前に、メタデータと配布元リンクを確認してください。
