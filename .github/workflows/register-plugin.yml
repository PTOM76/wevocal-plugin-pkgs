name: Register plugin

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Import the official WAM catalog or add one URL
        type: choice
        options:
          - sync_wam
          - add
        default: sync_wam
        required: true
      type:
        description: Plugin URL type (used for add)
        type: choice
        options:
          - wam
          - manifest
          - vst
        default: wam
        required: true
      id:
        description: Stable catalog id (used for add)
        type: string
        required: false
      name:
        description: Display name (used for add)
        type: string
        required: false
      author:
        description: Author (used for add)
        type: string
        required: false
      url:
        description: Original plugin URL (used for add)
        type: string
        required: false
      description:
        description: Short description
        type: string
        required: false
      website:
        description: Author or plugin website
        type: string
        required: false
      categories:
        description: Comma-separated categories
        type: string
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import WAM catalog
        if: inputs.operation == 'sync_wam'
        run: node scripts/catalog.mjs sync-wam
      - name: Add plugin URL
        if: inputs.operation == 'add'
        env:
          PLUGIN_TYPE: ${{ inputs.type }}
          PLUGIN_ID: ${{ inputs.id }}
          PLUGIN_NAME: ${{ inputs.name }}
          PLUGIN_AUTHOR: ${{ inputs.author }}
          PLUGIN_URL: ${{ inputs.url }}
          PLUGIN_DESCRIPTION: ${{ inputs.description }}
          PLUGIN_WEBSITE: ${{ inputs.website }}
          PLUGIN_CATEGORIES: ${{ inputs.categories }}
        run: |
          node scripts/catalog.mjs add "$PLUGIN_TYPE" "$PLUGIN_ID" "$PLUGIN_NAME" "$PLUGIN_AUTHOR" "$PLUGIN_URL" "$PLUGIN_DESCRIPTION" "$PLUGIN_WEBSITE" "$PLUGIN_CATEGORIES"
      - name: Open registration pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: plugin-registration-${{ github.run_id }}
          delete-branch: true
          commit-message: "catalog: update plugin registrations"
          title: "catalog: update plugin registrations"
          body: |
            Generated by the **Register plugin** workflow.

            Review the metadata and original URLs before merging. No plugin binaries are stored in this repository.
