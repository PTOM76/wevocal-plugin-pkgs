# GitHubログイン済みユーザーからプラグイン登録情報を受け付けるフォーム（scripts/issue-templates.mjs で生成）。
name: "플러그인 등록"
description: "플러그인 메타데이터와 배포 링크의 게재를 신청"
title: "[플러그인 등록]"
body:
  - type: markdown
    attributes:
      value: |
        GitHub 계정으로 제출자를 확인합니다. 필수 항목은 배포 링크뿐입니다. 종류, ID, 이름, 작성자 등을 비워 두면 배포처의 정보(WAM은 같은 폴더의 descriptor.json, 매니페스트는 그 JSON)에서 자동으로 채워집니다. 입력한 항목이 우선합니다.
  - type: dropdown
    id: type
    attributes:
      label: "종류"
      options:
        - wam
        - manifest
        - vst
    validations:
      required: false
  - type: input
    id: id
    attributes:
      label: "ID"
      description: "선택. 비워 두면 배포처의 정보로 정해집니다. 영문 소문자, 숫자, 마침표, 하이픈, 밑줄을 사용하세요 (2~96자)."
      placeholder: com.example.plugin
    validations:
      required: false
      max-length: 96
  - type: input
    id: name
    attributes:
      label: "플러그인 이름"
      description: "선택. 비워 두면 배포처의 정보로 정해집니다."
      placeholder: Example Reverb
    validations:
      required: false
      max-length: 120
  - type: input
    id: author
    attributes:
      label: "작성자"
      description: "선택. 비워 두면 배포처의 정보로 정해집니다."
    validations:
      required: false
      max-length: 120
  - type: input
    id: url
    attributes:
      label: "배포 링크"
      description: "종류에 맞는 WAM JavaScript, JSON 매니페스트 또는 VST DLL의 HTTPS URL."
      placeholder: https://example.com/plugin.js
    validations:
      required: true
      max-length: 2048
  - type: input
    id: description
    attributes:
      label: "설명 (선택)"
    validations:
      required: false
      max-length: 500
  - type: input
    id: website
    attributes:
      label: "작성자 사이트 (선택)"
      description: "HTTPS URL을 입력하세요."
    validations:
      required: false
      max-length: 2048
  - type: input
    id: categories
    attributes:
      label: "카테고리 (쉼표로 구분, 선택)"
      placeholder: Effect, Reverb
    validations:
      required: false
      max-length: 400
