# GitHub Issue Form の投稿を検証し、レビュー用のプルリクエストを作る。
name: プラグイン投稿を審査

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: plugin-submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  submit:
    if: startsWith(github.event.issue.title, '[プラグイン登録]')
    name: 投稿を検証してプルリクエストを作成
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 投稿内容を解析
        run: node scripts/issue-submission.mjs "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/plugin-submission.json"
      - name: メタデータを検証してカタログへ追加
        run: node scripts/catalog.mjs add-json "$RUNNER_TEMP/plugin-submission.json"
      - name: レビュー用プルリクエストを作成
        id: pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: plugin-submission-${{ github.event.issue.number }}
          delete-branch: true
          commit-message: "catalog: プラグイン登録情報を追加"
          title: "プラグインカタログ: 登録提案 #${{ github.event.issue.number }}"
          body: |
            **GitHub Issue Form** から送信された登録提案です。

            - 投稿者: @${{ github.event.issue.user.login }}
            - 投稿: ${{ github.event.issue.html_url }}

            マージ前に、メタデータと配布元リンクを確認してください。
      - name: Issue に結果を通知
        if: steps.pull-request.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        env:
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        with:
          script: |
            const number = Number(process.env.PULL_REQUEST_NUMBER)
            if (!Number.isSafeInteger(number) || number < 1) {
              throw new Error('作成されたプルリクエスト番号が不正です')
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `投稿を受け付け、レビュー用の PR #${number} を作成しました。確認後にメンテナーがマージします。\n\n任意でChreeIDアカウントを連携する場合は、このIssueに \`/link-chreeid\` とコメントしてください。`,
            })
      - name: 失敗を Issue に通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '投稿を自動処理できませんでした。入力内容を確認するか、メンテナーに連絡してください。',
            })
