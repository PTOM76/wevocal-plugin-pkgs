# メンテナーがカタログを直接直す（WAM の同期、登録、更新、削除、投稿者の設定）。結果はレビュー用のプルリクエストにする。
name: プラグインを登録

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 行う操作
        type: choice
        options:
          - WAMカタログを同期
          - 登録
          - 更新
          - 削除
          - 版を再確認
        default: WAMカタログを同期
        required: true
      id:
        description: プラグインの固定 ID（登録では、空なら配布元の情報から決める。版を再確認では、空にすると全部）
        type: string
        required: false
      type:
        description: 種類（登録のときだけ使う。自動なら配布 URL の拡張子で決める）
        type: choice
        options:
          - 自動
          - wam
          - manifest
          - vst
        default: 自動
        required: true
      name:
        description: 表示名
        type: string
        required: false
      author:
        description: 作者名
        type: string
        required: false
      url:
        description: プラグインの配布元 URL（登録では、これだけで足りる。名前や作者などは配布元の情報から入る）
        type: string
        required: false
      description:
        description: 短い説明
        type: string
        required: false
      website:
        description: 作者またはプラグインのウェブサイト
        type: string
        required: false
      categories:
        description: カテゴリ（カンマ区切り）
        type: string
        required: false
      submitter:
        description: 登録した投稿者の GitHub ユーザー名（この人だけが掲載申請で更新できる）
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  register:
    name: カタログを更新
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WAMカタログを取り込む
        if: inputs.operation == 'WAMカタログを同期'
        run: node scripts/catalog.mjs sync-wam
      - name: プラグインを登録
        if: inputs.operation == '登録'
        env:
          PLUGIN_TYPE: ${{ inputs.type }}
          PLUGIN_ID: ${{ inputs.id }}
          PLUGIN_NAME: ${{ inputs.name }}
          PLUGIN_AUTHOR: ${{ inputs.author }}
          PLUGIN_URL: ${{ inputs.url }}
          PLUGIN_DESCRIPTION: ${{ inputs.description }}
          PLUGIN_WEBSITE: ${{ inputs.website }}
          PLUGIN_CATEGORIES: ${{ inputs.categories }}
          PLUGIN_SUBMITTER: ${{ inputs.submitter }}
        run: |
          if [ "$PLUGIN_TYPE" = "自動" ]; then PLUGIN_TYPE=""; fi
          node scripts/catalog.mjs add "$PLUGIN_TYPE" "$PLUGIN_ID" "$PLUGIN_NAME" "$PLUGIN_AUTHOR" "$PLUGIN_URL" "$PLUGIN_DESCRIPTION" "$PLUGIN_WEBSITE" "$PLUGIN_CATEGORIES" "$PLUGIN_SUBMITTER"
      - name: プラグインを更新
        if: inputs.operation == '更新'
        env:
          PLUGIN_TYPE: ${{ inputs.type }}
          PLUGIN_ID: ${{ inputs.id }}
          PLUGIN_NAME: ${{ inputs.name }}
          PLUGIN_AUTHOR: ${{ inputs.author }}
          PLUGIN_URL: ${{ inputs.url }}
          PLUGIN_DESCRIPTION: ${{ inputs.description }}
          PLUGIN_WEBSITE: ${{ inputs.website }}
          PLUGIN_CATEGORIES: ${{ inputs.categories }}
          PLUGIN_SUBMITTER: ${{ inputs.submitter }}
        # 空の項目は変えない。種類は選択式で空にできないので、更新では変えない（変えるときは削除して登録し直す）
        run: |
          node scripts/catalog.mjs update "$PLUGIN_ID" "name=$PLUGIN_NAME" "author=$PLUGIN_AUTHOR" "url=$PLUGIN_URL" "description=$PLUGIN_DESCRIPTION" "website=$PLUGIN_WEBSITE" "categories=$PLUGIN_CATEGORIES" "submitter=$PLUGIN_SUBMITTER"
      - name: 配布元の版を取り直す
        if: inputs.operation == '版を再確認'
        env:
          PLUGIN_ID: ${{ inputs.id }}
        run: node scripts/catalog.mjs refresh-versions "$PLUGIN_ID"
      - name: プラグインを削除
        if: inputs.operation == '削除'
        env:
          PLUGIN_ID: ${{ inputs.id }}
        run: node scripts/catalog.mjs remove "$PLUGIN_ID"
      - name: 変更内容のプルリクエストを作成
        uses: peter-evans/create-pull-request@v7
        with:
          branch: plugin-registration-${{ github.run_id }}
          delete-branch: true
          commit-message: "catalog: ${{ inputs.operation }}"
          title: "プラグインカタログ: ${{ inputs.operation }}${{ inputs.id && format('（{0}）', inputs.id) || '' }}"
          body: |
            メンテナーが実行したワークフロー（${{ inputs.operation }}）による変更です。

            マージする前に、メタデータと配布元リンクを確認してください。
