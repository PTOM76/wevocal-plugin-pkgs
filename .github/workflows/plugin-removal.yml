# 取り下げの Issue Form の投稿を検証し、登録した投稿者本人のときだけ、削除のレビュー用プルリクエストを作る。
name: プラグイン取り下げを審査

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: plugin-removal-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  withdraw:
    if: >-
      startsWith(github.event.issue.title, '[プラグイン取り下げ]') ||
      startsWith(github.event.issue.title, '[Plugin removal]') ||
      startsWith(github.event.issue.title, '[플러그인 삭제]') ||
      startsWith(github.event.issue.title, '[插件撤下]') ||
      startsWith(github.event.issue.title, '[外掛下架]')
    name: 取り下げを検証してプルリクエストを作成
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 投稿内容を解析
        id: parse
        run: |
          node scripts/issue-removal.mjs "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/plugin-removal.json"
          echo "id=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).id)' "$RUNNER_TEMP/plugin-removal.json")" >> "$GITHUB_OUTPUT"
      - name: 投稿者を確認してカタログから削除
        env:
          ISSUE_USER: ${{ github.event.issue.user.login }}
          PLUGIN_ID: ${{ steps.parse.outputs.id }}
        run: node scripts/catalog.mjs withdraw "$PLUGIN_ID" "$ISSUE_USER"
      - name: レビュー用プルリクエストを作成
        id: pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: plugin-removal-${{ github.event.issue.number }}
          delete-branch: true
          commit-message: "catalog: プラグインを取り下げ（${{ steps.parse.outputs.id }}）"
          title: "プラグインカタログ: 取り下げ提案 #${{ github.event.issue.number }}"
          body: |
            **GitHub Issue Form** から送信された取り下げの申請です。登録した投稿者本人の申請であることは、ワークフローが確認済みです。

            - 対象: `${{ steps.parse.outputs.id }}`
            - 投稿者: @${{ github.event.issue.user.login }}
            - 投稿: ${{ github.event.issue.html_url }}

            マージ前に、対象のプラグインが合っていることを確認してください。

            マージすると、この投稿の Issue は自動で閉じます。

            Closes #${{ github.event.issue.number }}
      - name: Issue に結果を通知
        if: steps.pull-request.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        env:
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        with:
          script: |
            const { replyText } = await import(`file://${process.env.GITHUB_WORKSPACE}/scripts/submission-i18n.mjs`)
            const { removalLangOfTitle } = await import(`file://${process.env.GITHUB_WORKSPACE}/scripts/removal-i18n.mjs`)
            const number = Number(process.env.PULL_REQUEST_NUMBER)
            if (!Number.isSafeInteger(number) || number < 1) {
              throw new Error('作成されたプルリクエスト番号が不正です')
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: replyText(removalLangOfTitle(context.payload.issue.title), 'pullRequest', number),
            })
      - name: 失敗を Issue に通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { removalLangOfTitle, removalReply } = await import(`file://${process.env.GITHUB_WORKSPACE}/scripts/removal-i18n.mjs`)
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: removalReply(removalLangOfTitle(context.payload.issue.title), 'failed'),
            })
